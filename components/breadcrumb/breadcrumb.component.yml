"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Breadcrumb
status: stable
description: Breadcrumb component based on daisyUI. Accepts a list of items each with text and optional url.
props:
  type: object
  required:
    - items
  properties:
    items:
      title: Items
      description: "Array of items. Each item: { text: string, url?: string }."
      type: array
      items:
        type: object
        properties:
          text:
            type: string
          url:
            type: string
    size:
      title: Size
      description: Defaults to text-sm.
      type: string
      enum:
        - text-xs
        - text-sm
        - text-base
        - text-lg
      "meta:enum":
        text-xs: "Extra small"
        text-sm: "Small (default)"
        text-base: Base
        text-lg: Large
      examples:
        - text-sm
