"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Text
status: stable
group: Content
props:
  type: object
  properties:
    text:
      type: string
      title: Text
      contentMediaType: text/html
      examples:
        - <p>This is some text.</p>
    align:
      type: string
      title: Text Alignment
      description: The text alignment
      enum:
        - left
        - center
        - right
      "meta:enum":
        left: "Left (default)"
        center: Center
        right: Right
      default: left
      examples:
        - left
