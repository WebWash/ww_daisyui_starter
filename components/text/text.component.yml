"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Text
status: stable
group: Content
props:
  type: object
  properties:
    text:
      type: string
      title: Text
      description: |
        Rich-text content authored via Canvas's CKEditor. Supports
        block-level elements - paragraphs, headings, lists,
        blockquotes, links, etc. The rendered output picks up the
        theme's prose styling automatically.
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - "<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Pellentesque commodo lacus at sodales sodales.</p>"
    text_size:
      type: string
      title: Text size
      description: |
        Body text size. Leave unset to keep the standard size. Scales
        paragraphs and lists; headings typed inside keep their own size.
      enum:
        - sm
        - lg
        - xl
        - 2xl
      "meta:enum":
        sm: "Small"
        lg: "L"
        xl: "XL"
        2xl: "2XL"
    align:
      type: string
      title: Text Alignment
      description: The text alignment
      enum:
        - left
        - center
        - right
      "meta:enum":
        left: Left
        center: Center
        right: Right
