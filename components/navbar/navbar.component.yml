"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Navbar
status: stable
noUi: true
description: Site header built on the daisyUI navbar pattern.
slots:
  navbar_start:
    title: Navbar start
    description: >-
      Left section (typically the system_branding_block placed in the
      navbar_start region).
  navbar_center:
    title: Navbar center
    description: >-
      Center section (typically the system_menu_block placed in the
      navbar_center region, with "Expand all menu links" enabled).
  navbar_end:
    title: Navbar end
    description: >-
      Right section (blocks placed in the navbar_end region). The megamenu
      hamburger button is always rendered after this slot's content.
