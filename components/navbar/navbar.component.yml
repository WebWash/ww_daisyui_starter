"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Navbar
status: stable
# Theme-only component: slots expect Drupal block render arrays
# (system_branding_block, system_menu_block) that the Canvas editor
# cannot supply, so hide it from the component picker.
noUi: true
description: Site header built on the daisyUI navbar pattern. Slots accept the branding (logo) and main menu render arrays; placeholder markup renders when slots are empty.
props:
  type: object
  properties:
    site_name:
      type: string
      title: Site name
      description: Used as the logo fallback text when the logo slot is empty.
      default: ""
slots:
  logo:
    title: Logo
    description: Branding render array (typically the system_branding_block).
  menu:
    title: Main menu
    description: Main navigation render array (typically a system_menu_block).
