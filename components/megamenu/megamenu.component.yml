"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Megamenu
status: stable
group: Navigation
# Theme-only component: `items` expects Drupal's processed menu link tree
# (the `items` array from template_preprocess_menu), which the Canvas editor
# cannot supply, so hide it from the component picker.
noUi: true
description: >-
  Horizontal mega menu built on the daisyUI megamenu pattern. Fed Drupal's
  processed main-menu link tree, it renders each top-level item with children
  as a button that opens a popover of column-grouped links (L1 button → L2
  column headings → L3 links). Childless top-level items render as plain links.
  Desktop only — mobile navigation is handled by the navbar drawer.
props:
  type: object
  properties:
    items:
      type: array
      title: Menu items
      description: >-
        Drupal's processed menu link tree (the `items` array passed to
        template_preprocess_menu). Each item has `title`, `url`, `below`,
        `is_expanded` and `in_active_trail`.
    id:
      type: string
      title: Instance id
      description: >-
        Unique-per-page prefix used to build popover element ids
        (mm-{id}-{index}). Defaults to "main".
      default: main
    width:
      type: string
      title: Width
      description: daisyUI megamenu width modifier.
      enum:
        - default
        - wide
        - full
      "meta:enum":
        default: "Default (auto width)"
        wide: "Wide (megamenu-wide)"
        full: "Full (megamenu-full)"
      default: wide
    size:
      type: string
      title: Size
      description: daisyUI megamenu size modifier.
      enum:
        - megamenu-xs
        - megamenu-sm
        - megamenu-md
        - megamenu-lg
        - megamenu-xl
      "meta:enum":
        megamenu-xs: "Extra small"
        megamenu-sm: "Small"
        megamenu-md: "Medium (default)"
        megamenu-lg: "Large"
        megamenu-xl: "Extra large"
      default: megamenu-md
