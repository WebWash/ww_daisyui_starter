"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Section
status: stable
group: Layout
description: |
  Top-level page wrapper. Combines a CSS-grid layout (with separate
  desktop, mobile and Views column controls) with the theme-wide
  spacing scale and daisyUI colour palette used by the Hero. Compose
  pages by dropping content into the header / main / footer slots.
props:
  type: object
  properties:
    width:
      title: Section width
      description: Maximum width of the inner content column on large screens.
      type: string
      enum:
        - "100%"
        - "90%"
        - "80%"
        - "75%"
        - "50%"
      "meta:enum":
        "100%": "100% (full)"
        "90%": "90%"
        "80%": "80%"
        "75%": "75%"
        "50%": "50%"
      examples:
        - "100%"
    columns:
      title: Grid layout
      description: Layout selected applies on desktop and tablet.
      type: string
      enum:
        - "100"
        - "50-50"
        - "33-33-33"
        - "75-25"
        - "25-75"
        - "67-33"
        - "33-67"
        - "50-25-25"
        - "25-25-50"
        - "25-25-25-25"
      "meta:enum":
        "100": "100"
        "50-50": "50/50"
        "33-33-33": "33/33/33"
        "75-25": "75/25"
        "25-75": "25/75"
        "67-33": "67/33"
        "33-67": "33/67"
        "50-25-25": "50/25/25"
        "25-25-50": "25/25/50"
        "25-25-25-25": "25/25/25/25"
      examples:
        - "100"
    views_columns:
      title: Views grid
      description: |
        If you are placing a View inside this section, choose the grid
        layout to apply to the view's items.
      type: string
      enum:
        - "50-50"
        - "33-33-33"
        - "25-25-25-25"
      "meta:enum":
        "50-50": "Two columns"
        "33-33-33": "Three columns"
        "25-25-25-25": "Four columns"
    mobile_columns:
      title: Columns on mobile
      description: Number of columns to show on mobile (below the tablet breakpoint).
      type: string
      enum:
        - "1"
        - "2"
        - "3"
      "meta:enum":
        "1": "1"
        "2": "2"
        "3": "3"
      examples:
        - "1"
    color_palette:
      title: Color palette
      description: |
        daisyUI palette to apply to the section.
      type: string
      enum:
        - base-100
        - base-200
        - base-300
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
      "meta:enum":
        base-100: "Base 100 (page surface)"
        base-200: "Base 200 (subtle)"
        base-300: "Base 300 (sunken)"
        neutral: Neutral
        primary: Primary
        secondary: Secondary
        accent: Accent
        info: Info
        success: Success
        warning: Warning
        error: Error
      examples:
        - base-100
    padding_block_start:
      type: string
      title: "Padding top"
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "32"
    padding_block_end:
      type: string
      title: "Padding bottom"
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "32"
    margin_block_start:
      type: string
      title: "Margin top"
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "0"
    margin_block_end:
      type: string
      title: "Margin bottom"
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "0"
    section_header:
      type: boolean
      title: Show header region
      description: When off, the header slot is not rendered.
      examples:
        - true
    section_footer:
      type: boolean
      title: Show footer region
      description: When off, the footer slot is not rendered.
      examples:
        - true
    background_media:
      "$ref": "json-schema-definitions://canvas.module/image"
      title: Background image
      description: Optional background image rendered behind the section content.
      type: object
slots:
  header:
    title: Header
    description: Optional region rendered above the grid (e.g. a heading and intro).
  main:
    title: Grid
    description: Main content area; children flow into the configured grid columns.
  footer:
    title: Footer
    description: Optional region rendered below the grid.
