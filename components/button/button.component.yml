"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Button
status: stable
description: Button component based on daisyUI. Renders as an anchor when a URL is provided, otherwise as a button element.
props:
  type: object
  required:
    - text
  properties:
    text:
      title: Text
      type: string
      examples:
        - Read more
    url:
      title: URL
      description: Optional href. When set the component renders as an <a>.
      type: string
      format: iri-reference
      examples:
        - https://example.com/
    size:
      title: Size
      description: Defaults to btn-md when omitted.
      type: string
      enum:
        - btn-xs
        - btn-sm
        - btn-md
        - btn-lg
        - btn-xl
      "meta:enum":
        btn-xs: "Extra small"
        btn-sm: Small
        btn-md: "Medium (default)"
        btn-lg: Large
        btn-xl: "Extra large"
      examples:
        - btn-md
    color:
      title: Color
      description: Defaults to btn-primary when omitted.
      type: string
      enum:
        - btn-neutral
        - btn-primary
        - btn-secondary
        - btn-accent
        - btn-info
        - btn-success
        - btn-warning
        - btn-error
      "meta:enum":
        btn-neutral: Neutral
        btn-primary: "Primary (default)"
        btn-secondary: Secondary
        btn-accent: Accent
        btn-info: Info
        btn-success: Success
        btn-warning: Warning
        btn-error: Error
      examples:
        - btn-primary
    variant:
      title: Variant
      description: Defaults to "default" (solid) when omitted.
      type: string
      enum:
        - ""
        - default
        - btn-outline
        - btn-dash
        - btn-soft
        - btn-ghost
        - btn-link
      "meta:enum":
        default: "Default (solid)"
        btn-outline: Outline
        btn-dash: Dashed
        btn-soft: Soft
        btn-ghost: Ghost
        btn-link: Link
      examples:
        - default
    icon:
      title: Icon
      description: 'Optional Phosphor icon name (e.g. "arrow-right", "rocket"). See https://phosphoricons.com.'
      type: string
      examples:
        - arrow-right
    icon_position:
      title: Icon position
      description: 'Where to place the icon relative to the text (logical, RTL-aware). Defaults to "start".'
      type: string
      enum:
        - start
        - end
      "meta:enum":
        start: "Start (default)"
        end: End
      examples:
        - start
