"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Group
group: Layout
status: stable
description: |
  Flex group for stacking or aligning child components. Uses the same
  spacing scale and daisyUI colour palette options as the Section component.
props:
  type: object
  required:
    - flex_direction
    - flex_align
    - items_align
  properties:
    flex_direction:
      type: string
      title: Item direction
      enum:
        - column
        - row
      meta:enum:
        column: Vertical
        row: Horizontal
      default: "column"
      examples:
        - "column"
    flex_gap:
      type: string
      title: Space between items
      enum:
        - sm
        - md
        - lg
        - xl
      meta:enum:
        sm: Small
        md: Medium
        lg: Large
        xl: Extra-Large
      examples:
        - md
    items_align:
      type: string
      title: Alignment within group
      enum:
        - start
        - center
        - end
      meta:enum:
        start: Start
        center: Center
        end: End
      default: "start"
      examples:
        - "start"
    flex_align:
      type: string
      title: Alignment within parent
      enum:
        - start
        - center
        - end
      meta:enum:
        start: Start
        center: Center
        end: End
      default: "center"
      examples:
        - "center"
    radius:
      type: string
      title: Rounded corners
      enum:
        - sm
        - md
        - lg
        - xl
      meta:enum:
        sm: Small
        md: Medium
        lg: Large
        xl: Extra-Large
      examples:
        - sm
    color_palette:
      title: Color palette
      description: |
        daisyUI palette to apply to the group. Each palette pairs the
        background with its matching content (text) colour so dropped-in
        components inherit a readable foreground.
      type: string
      enum:
        - base-100
        - base-200
        - base-300
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
      "meta:enum":
        base-100: "Base 100 (page surface)"
        base-200: "Base 200 (subtle)"
        base-300: "Base 300 (sunken)"
        neutral: Neutral
        primary: Primary
        secondary: Secondary
        accent: Accent
        info: Info
        success: Success
        warning: Warning
        error: Error
      examples:
        - base-100
    padding_block_start:
      type: string
      title: "Padding top"
      description: "Inner space at the top of the group. Scales up at tablet/desktop breakpoints."
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0 (None)"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "0"
    padding_block_end:
      type: string
      title: "Padding bottom"
      description: "Inner space at the bottom of the group. Scales up at tablet/desktop breakpoints."
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0 (None)"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "0"
    margin_block_start:
      type: string
      title: "Margin top"
      description: "Outer space above the group. Scales up at tablet/desktop breakpoints."
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0 (None)"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "0"
    margin_block_end:
      type: string
      title: "Margin bottom"
      description: "Outer space below the group. Scales up at tablet/desktop breakpoints."
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0 (None)"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "0"
    stretch:
      type: boolean
      title: Stretch group to fit container
      examples:
        - false
      default: false
    animation:
      type: string
      title: Animation
      enum:
        - fade_up
        - fade_down
        - fade_left
        - fade_right
      meta:enum:
        fade_up: Fade up
        fade_down: Fade down
        fade_left: Fade left
        fade_right: Fade right
    animation_duration:
      type: string
      title: Animation duration
      description: The amount of time (in milliseconds) the animation will take to complete.
      enum:
        - "150"
        - "300"
        - "600"
      meta:enum:
        150: Fast
        300: Standard
        600: Slow
      default: "300"
    animation_delay:
      type: string
      title: Animation delay
      description: The amount of time (in milliseconds) to wait before starting the animation.
      enum:
        - "300"
        - "600"
      meta:enum:
        300: Short
        600: Long

slots:
  group_slot:
    title: "Group items"
