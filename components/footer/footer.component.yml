"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Footer
status: stable
description: Footer component based on daisyUI. Three equal columns (start, middle, end) above an optional bottom row.
slots:
  start:
    title: Start
    description: First column. Typically branding — logo, site name, tagline.
  middle:
    title: Middle
    description: Second column. Typically footer link columns.
  end:
    title: End
    description: Third column. Typically social icon links.
  bottom:
    title: Bottom
    description: Bottom copyright / utility row, rendered below the main footer.
props:
  type: object
  properties:
    color_palette:
      title: Color palette
      description: |
        daisyUI palette to apply to the footer.
      type: string
      enum:
        - base-100
        - base-200
        - base-300
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
      "meta:enum":
        base-100: "Base 100 (page surface)"
        base-200: "Base 200 (subtle)"
        base-300: "Base 300 (sunken)"
        neutral: Neutral
        primary: Primary
        secondary: Secondary
        accent: Accent
        info: Info
        success: Success
        warning: Warning
        error: Error
      examples:
        - base-200
    padding_block_start:
      type: string
      title: "Padding top"
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "32"
    padding_block_end:
      type: string
      title: "Padding bottom"
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "32"
    margin_block_start:
      type: string
      title: "Margin top"
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "0"
    margin_block_end:
      type: string
      title: "Margin bottom"
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "0"
