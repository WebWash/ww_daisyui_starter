"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Footer
status: stable
# Theme-only component: branding/links/social/bottom slots expect
# Drupal block render arrays that the Canvas editor cannot supply.
noUi: true
description: Footer component based on daisyUI. Uses slots for branding, link columns, social icons, and a bottom copyright row.
slots:
  branding:
    title: Branding
    description: Logo, site name, tagline. Rendered inside an <aside>.
  links:
    title: Links
    description: One or more <nav> blocks of footer links.
  social:
    title: Social
    description: Social icon links.
  bottom:
    title: Bottom
    description: Bottom copyright / utility row, rendered below the main footer.
props:
  type: object
  properties:
    # Renamed from `variant` because Drupal core's ComponentElement render
    # element auto-injects an empty-string `#variant` into `props['variant']`
    # whenever a caller omits it (see ComponentElement::preRenderComponent
    # and getInfo defaults), which collides with our enum and prevents
    # removing the empty-string entry that Canvas refuses.
    style:
      title: Style
      description: Defaults to "default" (horizontal columns from sm up) when omitted.
      type: string
      enum:
        - default
        - center
      "meta:enum":
        default: "Default (horizontal columns from sm up)"
        center: "Center (single centered column)"
      default: default
      examples:
        - default
    bg_color:
      title: Background colour
      description: Background and text colour combination. Defaults to base-200.
      type: string
      enum:
        - default
        - base-200
        - base-300
        - neutral
        - primary
        - dark
      "meta:enum":
        default: "Default (transparent)"
        base-200: "Base 200 (default)"
        base-300: Base 300
        neutral: Neutral
        primary: Primary
        dark: Dark (gray-900)
      examples:
        - base-200
    padding:
      title: Padding
      description: Defaults to p-10.
      type: string
      enum:
        - p-4
        - p-6
        - p-10
        - p-16
      "meta:enum":
        p-4: Small
        p-6: Medium
        p-10: "Large (default)"
        p-16: "Extra large"
      examples:
        - p-10
