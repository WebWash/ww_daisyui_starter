"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Badge
status: stable
group: Interactive
description: Badge component based on daisyUI. Renders as an anchor when a URL is provided, otherwise as a span element.
props:
  type: object
  required:
    - text
  properties:
    text:
      title: Text
      type: string
      examples:
        - New
    url:
      title: URL
      description: Optional href. When set the component renders as an <a>.
      type: string
      format: iri-reference
      examples:
        - https://example.com/
    size:
      title: Size
      description: Defaults to badge-md when omitted.
      type: string
      enum:
        - badge-xs
        - badge-sm
        - badge-md
        - badge-lg
        - badge-xl
      "meta:enum":
        badge-xs: "Extra small"
        badge-sm: Small
        badge-md: "Medium (default)"
        badge-lg: Large
        badge-xl: "Extra large"
      examples:
        - badge-md
    color:
      title: Color
      description: Defaults to badge-primary when omitted.
      type: string
      enum:
        - badge-neutral
        - badge-primary
        - badge-secondary
        - badge-accent
        - badge-info
        - badge-success
        - badge-warning
        - badge-error
      "meta:enum":
        badge-neutral: Neutral
        badge-primary: "Primary (default)"
        badge-secondary: Secondary
        badge-accent: Accent
        badge-info: Info
        badge-success: Success
        badge-warning: Warning
        badge-error: Error
      examples:
        - badge-primary
    # Renamed from `variant` because Drupal core's ComponentElement render
    # element auto-injects an empty-string `#variant` into `props['variant']`
    # whenever a caller omits it (see ComponentElement::preRenderComponent
    # and getInfo defaults), which collides with our enum and prevents
    # removing the empty-string entry that Canvas refuses.
    style:
      title: Style
      description: Defaults to "default" (solid) when omitted.
      type: string
      enum:
        - default
        - badge-outline
        - badge-dash
        - badge-soft
        - badge-ghost
      "meta:enum":
        default: "Default (solid)"
        badge-outline: Outline
        badge-dash: Dashed
        badge-soft: Soft
        badge-ghost: Ghost
      default: default
      examples:
        - default
    icon:
      title: Icon
      description: 'Optional Phosphor icon name (e.g. "star", "check-circle"). See https://phosphoricons.com.'
      type: string
      examples:
        - star
    icon_position:
      title: Icon position
      description: 'Where to place the icon relative to the text (logical, RTL-aware). Defaults to "start".'
      type: string
      enum:
        - start
        - end
      "meta:enum":
        start: "Start (default)"
        end: End
      examples:
        - start
