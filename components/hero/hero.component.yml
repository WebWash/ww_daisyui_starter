"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Hero
status: stable
group: Content
description: |
  Hero based on daisyUI. Heading and supporting copy are supplied as
  props (rich-text via the content prop); editors compose the actions
  by dropping Button SDCs into the actions slot. Image is supplied as
  a prop and is used as a side panel for side / side-reverse layouts
  and as the background for the overlay layout.
props:
  type: object
  properties:
    image:
      title: Image
      description: Optional image. Used as the side panel for the side / side-reverse layouts and as the background for the overlay layout.
      "$ref": "json-schema-definitions://canvas.module/image"
      examples:
        - src: https://picsum.photos/seed/hero/1600/900
          alt: Decorative hero image
    layout:
      title: Hero Layout
      type: string
      enum:
        - text_only
        - side
        - side-reverse
        - overlay
      "meta:enum":
        text_only: "Text only"
        side: "Side (image left, text right)"
        side-reverse: "Side reverse (text left, image right)"
        overlay: "Image background with overlay"
      examples:
        - side
    align:
      title: Alignment
      type: string
      enum:
        - left
        - center
        - right
      "meta:enum":
        left: Left
        center: Center
        right: Right
      examples:
        - left
    color_palette:
      title: Color palette
      description: |
        daisyUI palette to apply to the hero.
      type: string
      enum:
        - base-100
        - base-200
        - base-300
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
      "meta:enum":
        base-100: "Base 100 (page surface)"
        base-200: "Base 200 (subtle)"
        base-300: "Base 300 (sunken)"
        neutral: Neutral
        primary: Primary
        secondary: Secondary
        accent: Accent
        info: Info
        success: Success
        warning: Warning
        error: Error
      examples:
        - base-100
    min_height:
      title: Minimum height
      type: string
      enum:
        - sm
        - md
        - lg
      "meta:enum":
        sm: "Small (300px)"
        md: "Medium (500px)"
        lg: "Large (700px)"
      examples:
        - md
    margin_block_start:
      type: string
      title: "Margin top"
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "0"
    margin_block_end:
      type: string
      title: "Margin bottom"
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "0"
    padding_block_start:
      type: string
      title: "Padding top"
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "0"
    padding_block_end:
      type: string
      title: "Padding bottom"
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "0"
slots:
  heading:
    title: Heading
    description: |
      Drop a Heading SDC (or any heading markup) here.
  content:
    title: Content
    description: |
      Supporting copy for the hero. Wrapped with vertical padding (py-6).
  actions:
    title: Action items
    description: |
      Drop one or more Button SDCs (or any clickable components) here.
      Multiple items wrap and lay out side by side with spacing.
