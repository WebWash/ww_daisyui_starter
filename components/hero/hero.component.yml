"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Hero
status: stable
group: Content
description: |
  Hero based on daisyUI. Heading and supporting copy are supplied as
  props (rich-text via the content prop); editors compose the actions
  by dropping Button SDCs into the actions slot. Image is supplied as
  a prop and is used as a side panel for side / side-reverse layouts
  and as the background for the overlay layout.
props:
  type: object
  properties:
    heading_text:
      type: string
      title: Heading text
      examples:
        - "Hero Heading"
    heading_level:
      type: integer
      title: Heading level
      enum: [1, 2, 3, 4, 5, 6]
      examples:
        - 2
    content:
      type: string
      title: Content
      description: |
        Rich-text supporting copy authored via Canvas's CKEditor.
        Supports block-level elements - paragraphs, headings, lists,
        blockquotes, links, etc. The rendered output picks up the
        theme's prose styling automatically.
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - "<p>Hero content goes here...</p>"
    image:
      title: Image
      description: Optional image. Used as the side panel for the side / side-reverse layouts and as the background for the overlay layout.
      "$ref": "json-schema-definitions://canvas.module/image"
      examples:
        - src: https://picsum.photos/seed/hero/1600/900
          alt: Decorative hero image
    layout:
      title: Hero Layout
      type: string
      enum:
        - text_only
        - side
        - side-reverse
        - overlay
      "meta:enum":
        text_only: "Text only"
        side: "Side (image left, text right)"
        side-reverse: "Side reverse (text left, image right)"
        overlay: "Image background with overlay"
      examples:
        - side
    align:
      title: Alignment
      type: string
      enum:
        - left
        - center
        - right
      "meta:enum":
        left: Left
        center: Center
        right: Right
      examples:
        - left
    color_palette:
      title: Color palette
      description: |
        daisyUI palette to apply to the hero. Each palette pairs the
        background with its matching content (text) colour so dropped-in
        components inherit a readable foreground. Ignored when layout is
        "overlay".
      type: string
      enum:
        - base-100
        - base-200
        - base-300
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
      "meta:enum":
        base-100: "Base 100 (page surface)"
        base-200: "Base 200 (subtle)"
        base-300: "Base 300 (sunken)"
        neutral: Neutral
        primary: Primary
        secondary: Secondary
        accent: Accent
        info: Info
        success: Success
        warning: Warning
        error: Error
      examples:
        - base-100
    min_height:
      title: Minimum height
      type: string
      enum:
        - sm
        - md
        - lg
      "meta:enum":
        sm: "Small (300px)"
        md: "Medium (500px)"
        lg: "Large (700px)"
      examples:
        - md
    margin_block_start:
      type: string
      title: "Margin top"
      description: "Outer space above the hero. Scales up at tablet/desktop breakpoints."
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0 (None)"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "0"
    margin_block_end:
      type: string
      title: "Margin bottom"
      description: "Outer space below the hero. Scales up at tablet/desktop breakpoints."
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0 (None)"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "0"
    padding_block_start:
      type: string
      title: "Padding top"
      description: "Inner space at the top of the hero. Scales up at tablet/desktop breakpoints."
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0 (None)"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "0"
    padding_block_end:
      type: string
      title: "Padding bottom"
      description: "Inner space at the bottom of the hero. Scales up at tablet/desktop breakpoints."
      enum:
        - "0"
        - "8"
        - "20"
        - "32"
        - "48"
        - "64"
        - "96"
        - "128"
      "meta:enum":
        "0": "0 (None)"
        "8": "8 (8px)"
        "20": "20 (20px)"
        "32": "32 (24-32px)"
        "48": "48 (32-48px)"
        "64": "64 (40-64px)"
        "96": "96 (64-96px)"
        "128": "128 (80-128px)"
      examples:
        - "0"
slots:
  actions:
    title: Action items
    description: |
      Drop one or more Button SDCs (or any clickable components) here.
      Multiple items wrap and lay out side by side with spacing.
