"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Hero
status: stable
group: Content
description: |
  Hero based on daisyUI. Editors compose the inside via three slots —
  drop a Heading SDC into the heading slot, a Text SDC (rich-text) into
  content, and a Button SDC into cta. Image is supplied as a prop and
  is used as a side panel for side / side-reverse layouts and as the
  background for the overlay layout.
props:
  type: object
  properties:
    image:
      title: Image
      description: Optional image. Used as the side panel for the side / side-reverse layouts and as the background for the overlay layout.
      "$ref": "json-schema-definitions://canvas.module/image"
      examples:
        - src: https://picsum.photos/seed/hero/1600/900
          alt: Decorative hero image
    layout:
      title: Hero Layout
      description: Defaults to "text only" when omitted.
      type: string
      enum:
        - text_only
        - side
        - side-reverse
        - overlay
      "meta:enum":
        text_only: "Text only"
        side: "Side (image left, text right)"
        side-reverse: "Side reverse (text left, image right)"
        overlay: "Image background with overlay"
      default: text_only
      examples:
        - text_only
    align:
      title: Alignment
      description: Defaults to "left" when omitted.
      type: string
      enum:
        - left
        - center
        - right
      "meta:enum":
        left: "Left (default)"
        center: Center
        right: Right
      default: left
      examples:
        - left
    palettes:
      title: Palette
      description: |
        daisyUI palette to apply to the hero. Each palette pairs the
        background with its matching content (text) colour so dropped-in
        components inherit a readable foreground. Ignored when layout is
        "overlay". Defaults to "none" (transparent — let the surrounding
        page background show through).
      type: string
      enum:
        - none
        - base-100
        - base-200
        - base-300
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
      "meta:enum":
        none: "None (transparent)"
        base-100: "Base 100 (page surface)"
        base-200: "Base 200 (subtle)"
        base-300: "Base 300 (sunken)"
        neutral: Neutral
        primary: Primary
        secondary: Secondary
        accent: Accent
        info: Info
        success: Success
        warning: Warning
        error: Error
      default: none
      examples:
        - none
    min_height:
      title: Minimum height
      description: Defaults to "md" (500px).
      type: string
      enum:
        - none
        - sm
        - md
        - lg
        - screen
      "meta:enum":
        none: None
        sm: "Small (300px)"
        md: "Medium (500px, default)"
        lg: "Large (700px)"
        screen: "Full screen"
      default: md
      examples:
        - md
slots:
  heading:
    title: Heading
    description: Drop a Heading SDC (or any heading-shaped component) here. This is the hero's primary title.
  content:
    title: Content
    description: Rich-text intro / supporting copy. Drop a Text SDC for an editor-friendly rich-text experience.
  actions:
    title: Action items
    description: |
      Drop one or more Button SDCs (or any clickable components) here.
      Multiple items wrap and lay out side by side with spacing.
