"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Card
status: stable
group: Content
description: Card component based on daisyUI. Supports image, title, body, action link, sizes, borders, layout variants, and themed background colors with matching text colors.
props:
  type: object
  required:
    - title
  properties:
    title:
      title: Title
      type: string
      examples:
        - Card title
    title_heading_level:
      title: Title heading level
      description: Defaults to h3 when omitted.
      type: string
      enum:
        - h2
        - h3
        - h4
        - h5
        - h6
      "meta:enum":
        h2: "Heading 2"
        h3: "Heading 3 (default)"
        h4: "Heading 4"
        h5: "Heading 5"
        h6: "Heading 6"
      examples:
        - h3
    body:
      title: Body
      description: Body text rendered below the title.
      type: string
      examples:
        - A short description for the card.
    image:
      title: Image URL
      type: string
      format: iri-reference
      examples:
        - https://picsum.photos/seed/card/640/360
    image_alt:
      title: Image alt
      type: string
      examples:
        - Decorative image
    size:
      title: Size
      description: Defaults to card-md when omitted.
      type: string
      enum:
        - card-xs
        - card-sm
        - card-md
        - card-lg
        - card-xl
      "meta:enum":
        card-xs: "Extra small"
        card-sm: Small
        card-md: "Medium (default)"
        card-lg: Large
        card-xl: "Extra large"
      examples:
        - card-md
    border:
      title: Border
      description: Defaults to none when omitted.
      type: string
      enum:
        - none
        - card-border
        - card-dash
      "meta:enum":
        none: "None (default)"
        card-border: Border
        card-dash: Dashed
      examples:
        - none
    # Renamed from `variant` because Drupal core's ComponentElement render
    # element auto-injects an empty-string `#variant` into `props['variant']`
    # whenever a caller omits it (see ComponentElement::preRenderComponent
    # and getInfo defaults), which collides with our enum and prevents
    # removing the empty-string entry that Canvas refuses.
    style:
      title: Layout style
      description: Defaults to "default" (image on top) when omitted.
      type: string
      enum:
        - default
        - image-full
        - card-side
      "meta:enum":
        default: "Default (image on top)"
        image-full: Image full (image as background)
        card-side: Card side (image beside body)
      default: default
      examples:
        - default
    bg_color:
      title: Background colour
      description: Sets the card background and matching text colour. Defaults to "default" (base-100).
      type: string
      enum:
        - default
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
      "meta:enum":
        default: "Default (base-100)"
        neutral: Neutral
        primary: Primary
        secondary: Secondary
        accent: Accent
        info: Info
        success: Success
        warning: Warning
        error: Error
      examples:
        - default
    action_label:
      title: Action label
      description: Optional label for the action button rendered in card-actions.
      type: string
      examples:
        - Read more
    action_url:
      title: Action URL
      description: Optional href for the action button.
      type: string
      format: iri-reference
      examples:
        - https://example.com/
