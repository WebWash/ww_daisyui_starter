"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Card
status: stable
group: Content
description: Card component based on daisyUI. Supports image, title, body, an action slot, sizes, borders, layout variants, and the daisyUI colour palette with matching text colours.
props:
  type: object
  required:
    - title
  properties:
    title:
      title: Title
      type: string
      examples:
        - Card title
    title_heading_level:
      title: Title heading level
      description: Defaults to h3 when omitted.
      type: string
      enum:
        - h2
        - h3
        - h4
        - h5
        - h6
      "meta:enum":
        h2: "Heading 2"
        h3: "Heading 3 (default)"
        h4: "Heading 4"
        h5: "Heading 5"
        h6: "Heading 6"
      examples:
        - h3
    hide_card_title:
      title: Hide card title
      description: When enabled, the title heading is not rendered (e.g. when placing a heading component directly in the body slot).
      type: boolean
    image:
      title: Image
      description: Optional image rendered above the card body (or as the background for the image-full layout).
      "$ref": "json-schema-definitions://canvas.module/image"
      examples:
        - src: https://picsum.photos/seed/card/640/360
          alt: Decorative image
    size:
      title: Size
      description: Defaults to card-md when omitted.
      type: string
      enum:
        - card-xs
        - card-sm
        - card-md
        - card-lg
        - card-xl
      "meta:enum":
        card-xs: "Extra small"
        card-sm: Small
        card-md: Medium
        card-lg: Large
        card-xl: "Extra large"
      examples:
        - card-md
    border:
      title: Border
      description: No border when omitted.
      type: string
      enum:
        - card-border
        - card-dash
      "meta:enum":
        card-border: Border
        card-dash: Dashed
    style:
      title: Layout style
      description: Image on top when omitted.
      type: string
      enum:
        - image-full
        - card-side
      "meta:enum":
        image-full: Image full (image as background)
        card-side: Card side (image beside body)
    color_palette:
      title: Color palette
      description: |
        daisyUI palette to apply to the card background and matching text
        colour. Defaults to base-100 when omitted.
      type: string
      enum:
        - base-100
        - base-200
        - base-300
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
      "meta:enum":
        base-100: "Base 100 (page surface)"
        base-200: "Base 200 (subtle)"
        base-300: "Base 300 (sunken)"
        neutral: Neutral
        primary: Primary
        secondary: Secondary
        accent: Accent
        info: Info
        success: Success
        warning: Warning
        error: Error
      examples:
        - base-100
    body_alignment:
      title: Body alignment
      description: Centre the card body content (title, text and actions). Left-aligned when omitted.
      type: string
      enum:
        - center
      "meta:enum":
        center: Centered
    action_alignment:
      title: Action alignment
      description: Horizontal alignment of the action slot within card-actions. Unaligned when omitted.
      type: string
      enum:
        - start
        - center
        - end
        - between
      "meta:enum":
        start: Start
        center: Center
        end: End
        between: "Space between"
slots:
  card_body:
    title: Card body
    description: Content rendered in the card body below the title (e.g. text or other components).
  card_action:
    title: Card action
    description: Optional content rendered in the card-actions area (e.g. a button or link).
