"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Drawer
status: stable
# Theme-only page-shell primitive - wired up by the page template, not
# meant to be dropped into a Canvas page.
noUi: true
description: daisyUI drawer wrapper. Toggle by pointing a label[for=...] at the matching drawer_id.
props:
  type: object
  properties:
    drawer_id:
      type: string
      title: Drawer ID
      description: ID of the drawer-toggle checkbox; used by the controlling label[for=...].
      default: drawer
    side:
      type: string
      title: Side
      description: Edge the drawer slides in from.
      enum:
        - start
        - end
      "meta:enum":
        start: Start
        end: "End (default)"
      default: end
slots:
  content:
    title: Content
    description: Main page content rendered alongside the drawer.
  sidebar:
    title: Sidebar
    description: Off-canvas drawer panel content.
